name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Validate release version
        id: release
        run: node scripts/check-release.mjs
      - run: npm ci
      # prepublishOnly runs lint, tests, build and distribution checks.
      # prepack builds the tarball. Authentication uses npm's trusted publisher.
      - name: Publish package
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
